<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f6f2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SillyTavern">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Sign in | SillyTavern</title>
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/apple-icon-192x192.png">
    <link rel="icon" href="/basic-auth/assets/logo.png">
    <link rel="stylesheet" href="/basic-auth/assets/login.css">
    <script src="/basic-auth/assets/login.js" defer></script>
</head>
<body>
    <main class="entrance">
        <header class="brand">
            <img src="/basic-auth/assets/logo.png" alt="" width="72" height="72">
            <span>Your private tavern</span>
        </header>
        <section class="welcome" aria-labelledby="title">
            <p class="eyebrow">A place for your stories</p>
            <h1 id="title">SillyTavern</h1>
            <p class="intro" id="intro">Welcome back. Come on in.</p>
            <form id="login-form" method="post" action="/basic-auth/login">
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="512" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="2048" required>
                        <button id="toggle-password" class="visibility" type="button" aria-label="Show password" aria-pressed="false" title="Show password"><span class="icon eye" aria-hidden="true"></span></button>
                    </div>
                </div>
                <p id="status" role="status" aria-live="polite"></p>
                <button id="submit" class="primary" type="submit" disabled><span id="submit-label">Sign in</span><span class="icon arrow" aria-hidden="true"></span></button>
            </form>
            <div id="signed-in" hidden>
                <a id="continue" class="primary" href="/">Enter SillyTavern</a>
                <button id="logout" class="secondary" type="button"><span class="icon exit" aria-hidden="true"></span> Sign out</button>
            </div>
            <noscript><p>JavaScript is required to sign in securely.</p></noscript>
        </section>
        <footer><span class="icon lock" aria-hidden="true"></span> Private access</footer>
    </main>
    <div class="print-mark" aria-hidden="true">ST</div>
</body>
</html>
